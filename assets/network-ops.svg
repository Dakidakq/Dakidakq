<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="live route map — packets travelling hop by hop to core.dakidakq">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1b2129"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7ee787" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#7ee787" stop-opacity="0"/>
    </radialGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Consolas, "Liberation Mono", monospace; }
      .dim  { fill: #8b949e; }
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="#0d1117"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="17.5" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <text class="mono dim" x="48" y="56" font-size="13">LIVE ROUTE · 5 HOPS</text>
  <circle cx="1070" cy="210" r="110" fill="url(#glow)"/>

  <path d="M130 230 L370 120 L600 240 L830 110 L1070 210" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <path d="M130 230 L370 120 L600 240 L830 110 L1070 210" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.35">
    <animate attributeName="stroke-dashoffset" from="140" to="0" dur="7s" repeatCount="indefinite"/>
  </path>

  <!-- probe packet: pauses at every hop -->
  <circle r="6" fill="#58a6ff">
    <animateMotion dur="14s" repeatCount="indefinite" keyPoints="0;0;0.25;0.25;0.5;0.5;0.75;0.75;1;1" keyTimes="0;0.086;0.2;0.24;0.314;0.36;0.429;0.47;0.543;1" calcMode="linear" path="M130 230 L370 120 L600 240 L830 110 L1070 210"/>
  </circle>
  <!-- ack packet going home -->
  <circle r="4" fill="#3fb950" opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.66;0.95;1" values="0;1;0;0"/>
    <animateMotion dur="14s" repeatCount="indefinite" keyPoints="1;1;0;0" keyTimes="0;0.66;0.95;1" calcMode="linear" path="M130 230 L370 120 L600 240 L830 110 L1070 210"/>
  </circle>

  <!-- hops -->
  <g>
    <circle cx="130" cy="230" r="24" fill="none" stroke="#58a6ff" opacity="0">
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.086;0.15;1" values="0;0.8;0;0"/>
      <animate attributeName="r" dur="14s" repeatCount="indefinite" keyTimes="0;0.086;0.15;1" values="13;13;34;34"/>
    </circle>
    <circle cx="130" cy="230" r="12" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <circle cx="130" cy="230" r="4.5" fill="#58a6ff"/>
    <text class="mono dim" x="130" y="272" font-size="13" text-anchor="middle">home.lan</text>
    <text class="mono" x="130" y="292" font-size="12" fill="#7ee787" text-anchor="middle">0.4 ms</text>
  </g>
  <g>
    <circle cx="370" cy="120" r="24" fill="none" stroke="#58a6ff" opacity="0">
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.2;0.27;1" values="0;0.8;0;0"/>
      <animate attributeName="r" dur="14s" repeatCount="indefinite" keyTimes="0;0.2;0.27;1" values="13;13;34;34"/>
    </circle>
    <circle cx="370" cy="120" r="12" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <circle cx="370" cy="120" r="4.5" fill="#58a6ff"/>
    <text class="mono dim" x="370" y="88" font-size="13" text-anchor="middle">isp-edge</text>
    <text class="mono" x="370" y="68" font-size="12" fill="#7ee787" text-anchor="middle">3.1 ms</text>
  </g>
  <g>
    <circle cx="600" cy="240" r="24" fill="none" stroke="#d29922" opacity="0">
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.314;0.38;1" values="0;0.8;0;0"/>
      <animate attributeName="r" dur="14s" repeatCount="indefinite" keyTimes="0;0.314;0.38;1" values="13;13;34;34"/>
    </circle>
    <circle cx="600" cy="240" r="12" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <circle cx="600" cy="240" r="4.5" fill="#d29922"/>
    <text class="mono dim" x="600" y="282" font-size="13" text-anchor="middle">ix-peering</text>
    <text class="mono" x="600" y="302" font-size="12" fill="#d29922" text-anchor="middle">8.7 ms</text>
  </g>
  <g>
    <circle cx="830" cy="110" r="24" fill="none" stroke="#d29922" opacity="0">
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.429;0.5;1" values="0;0.8;0;0"/>
      <animate attributeName="r" dur="14s" repeatCount="indefinite" keyTimes="0;0.429;0.5;1" values="13;13;34;34"/>
    </circle>
    <circle cx="830" cy="110" r="12" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <circle cx="830" cy="110" r="4.5" fill="#d29922"/>
    <text class="mono dim" x="830" y="78" font-size="13" text-anchor="middle">bgp-core</text>
    <text class="mono" x="830" y="58" font-size="12" fill="#d29922" text-anchor="middle">12.9 ms</text>
  </g>
  <g>
    <circle cx="1070" cy="210" r="30" fill="none" stroke="#7ee787" opacity="0">
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.543;0.63;1" values="0;0.9;0;0"/>
      <animate attributeName="r" dur="14s" repeatCount="indefinite" keyTimes="0;0.543;0.63;1" values="18;18;48;48"/>
    </circle>
    <circle cx="1070" cy="210" r="18" fill="#161b22" stroke="#7ee787" stroke-width="2"/>
    <text class="mono" x="1070" y="215" font-size="12" fill="#7ee787" text-anchor="middle">core</text>
    <text class="mono dim" x="1070" y="258" font-size="13" text-anchor="middle">core.dakidakq</text>
    <text class="mono" x="1070" y="278" font-size="12" fill="#58a6ff" text-anchor="middle">14.2 ms</text>
  </g>

  <!-- status strip -->
  <text class="mono" x="1152" y="56" font-size="13" fill="#8b949e" text-anchor="end">status <tspan fill="#3fb950">● up</tspan>   packets <tspan fill="#58a6ff">∞</tspan>   loss <tspan fill="#7ee787">0%</tspan>   coffee <tspan fill="#d29922">99%</tspan></text>
</svg>
