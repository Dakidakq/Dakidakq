<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Dakidakq — network engineer">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#21262d"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1117" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#0d1117" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7ee787" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#7ee787" stop-opacity="0"/>
    </radialGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Consolas, "Liberation Mono", monospace; }
      .link { stroke: #30363d; stroke-width: 1.5; fill: none; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .label { font-size: 13px; fill: #8b949e; }
      .orbit { transform-origin: 950px 160px; animation: spin 24s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .ring { transform-origin: 950px 160px; animation: ringPulse 3.2s ease-out infinite; }
      @keyframes ringPulse { 0% { transform: scale(0.85); opacity: 0.8; } 100% { transform: scale(1.9); opacity: 0; } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="#0d1117"/>
  <rect width="1200" height="320" rx="18" fill="url(#dots)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="17.5" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- ===== right: network topology ===== -->
  <circle cx="950" cy="160" r="130" fill="url(#coreGlow)"/>

  <!-- orbit guides -->
  <circle cx="950" cy="160" r="96" fill="none" stroke="#21262d" stroke-width="1" stroke-dasharray="3 7"/>
  <circle cx="950" cy="160" r="52" fill="none" stroke="#21262d" stroke-width="1"/>

  <!-- links core to nodes -->
  <path id="lp" class="link" d="M950 160 L854 64"/>
  <path id="lt" class="link" d="M950 160 L1046 64"/>
  <path id="lc" class="link" d="M950 160 L854 256"/>
  <path id="ln" class="link" d="M950 160 L1046 256"/>
  <path id="lx" class="link" d="M854 64 L1046 64" stroke-dasharray="4 6"/>
  <path id="ly" class="link" d="M854 256 L1046 256" stroke-dasharray="4 6"/>

  <!-- packets -->
  <circle r="4" fill="#58a6ff"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#lp"/></animateMotion></circle>
  <circle r="4" fill="#58a6ff"><animateMotion dur="2.9s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#lt"/></animateMotion></circle>
  <circle r="4" fill="#7ee787"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#lc"/></animateMotion></circle>
  <circle r="4" fill="#d2a8ff"><animateMotion dur="2.7s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#ln"/></animateMotion></circle>
  <circle r="3" fill="#58a6ff" opacity="0.8"><animateMotion dur="4.6s" repeatCount="indefinite"><mpath href="#lx"/></animateMotion></circle>
  <circle r="3" fill="#d2a8ff" opacity="0.8"><animateMotion dur="5.2s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#ly"/></animateMotion></circle>

  <!-- satellites on orbit -->
  <g class="orbit">
    <circle cx="950" cy="64" r="3.5" fill="#58a6ff"/>
    <circle cx="1046" cy="160" r="3" fill="#7ee787"/>
    <circle cx="950" cy="256" r="3.5" fill="#d2a8ff"/>
    <circle cx="854" cy="160" r="3" fill="#8b949e"/>
  </g>

  <!-- edge nodes -->
  <g>
    <circle cx="854" cy="64" r="19" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <circle cx="854" cy="64" r="6" fill="#58a6ff"/>
    <text class="mono label" x="816" y="68" text-anchor="end">python</text>
  </g>
  <g>
    <circle cx="1046" cy="64" r="19" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <circle cx="1046" cy="64" r="6" fill="#58a6ff"/>
    <text class="mono label" x="1084" y="68" text-anchor="start">typescript</text>
  </g>
  <g>
    <circle cx="854" cy="256" r="19" fill="#161b22" stroke="#7ee787" stroke-width="1.5"/>
    <circle cx="854" cy="256" r="6" fill="#7ee787"/>
    <text class="mono label" x="816" y="260" text-anchor="end">c++</text>
  </g>
  <g>
    <circle cx="1046" cy="256" r="19" fill="#161b22" stroke="#d2a8ff" stroke-width="1.5"/>
    <circle cx="1046" cy="256" r="6" fill="#d2a8ff"/>
    <text class="mono label" x="1084" y="260" text-anchor="start">node.js</text>
  </g>

  <!-- core -->
  <circle class="ring" cx="950" cy="160" r="30" fill="none" stroke="#7ee787" stroke-width="1.5"/>
  <circle cx="950" cy="160" r="30" fill="#161b22" stroke="#7ee787" stroke-width="2"/>
  <text class="mono" x="950" y="165" text-anchor="middle" font-size="13" fill="#7ee787">core</text>

  <!-- ===== left: text ===== -->
  <rect x="0" y="0" width="720" height="320" rx="18" fill="url(#fade)"/>
  <text class="mono" x="70" y="108" font-size="20" fill="#7ee787">~/dakidakq $ <tspan fill="#e6edf3">whoami</tspan></text>
  <rect class="cursor" x="300" y="92" width="11" height="20" fill="#e6edf3"/>
  <text class="mono" x="66" y="182" font-size="68" font-weight="700" fill="#e6edf3">Dakidakq</text>
  <text class="mono" x="70" y="226" font-size="22" fill="#58a6ff">network engineer</text>
  <text class="mono" x="70" y="258" font-size="17" fill="#8b949e">python · c++ · typescript · node.js</text>
</svg>
