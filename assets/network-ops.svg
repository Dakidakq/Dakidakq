<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="live traceroute to core.dakidakq — animated network operations panel">
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1b2129"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Consolas, "Liberation Mono", monospace; }
      .dim  { fill: #8b949e; }
      .cur  { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1200" height="440" rx="18" fill="#0d1117"/>
  <rect width="1200" height="440" rx="18" fill="url(#grid)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="438.5" rx="17.5" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- ================= terminal (left) ================= -->
  <rect x="36" y="34" width="580" height="372" rx="12" fill="#161b22" stroke="#30363d"/>
  <rect x="36" y="34" width="580" height="38" rx="12" fill="#21262d"/>
  <rect x="36" y="58" width="580" height="14" fill="#21262d"/>
  <circle cx="62" cy="53" r="6" fill="#f85149"/>
  <circle cx="84" cy="53" r="6" fill="#d29922"/>
  <circle cx="106" cy="53" r="6" fill="#3fb950"/>
  <text class="mono dim" x="326" y="58" font-size="13" text-anchor="middle">dakidakq@core-01 — ssh</text>

  <g class="mono" font-size="15" xml:space="preserve">
    <text x="64" y="106" fill="#7ee787">$ <tspan fill="#e6edf3">traceroute core.dakidakq.net</tspan></text>

    <text x="64" y="140" fill="#8b949e" opacity="0">traceroute to core.dakidakq.net, 5 hops max
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.05;1" values="0;1;1"/>
    </text>

    <text x="64" y="174" fill="#e6edf3" opacity="0"> 1  home.lan        <tspan fill="#7ee787">0.4 ms</tspan>
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.086;1" values="0;1;1"/>
    </text>
    <text x="64" y="208" fill="#e6edf3" opacity="0"> 2  isp-edge        <tspan fill="#7ee787">3.1 ms</tspan>
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2;1" values="0;1;1"/>
    </text>
    <text x="64" y="242" fill="#e6edf3" opacity="0"> 3  ix-peering      <tspan fill="#d29922">8.7 ms</tspan>
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.314;1" values="0;1;1"/>
    </text>
    <text x="64" y="276" fill="#e6edf3" opacity="0"> 4  bgp-core        <tspan fill="#d29922">12.9 ms</tspan>
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.429;1" values="0;1;1"/>
    </text>
    <text x="64" y="310" fill="#e6edf3" opacity="0"> 5  core.dakidakq   <tspan fill="#58a6ff">14.2 ms</tspan>
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.543;1" values="0;1;1"/>
    </text>

    <text x="64" y="350" fill="#3fb950" opacity="0">✓ route established — all packets delivered
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.66;0.98;1" values="0;1;1;0"/>
    </text>
    <text x="64" y="384" fill="#7ee787">$ <tspan class="cur" fill="#e6edf3">▍</tspan></text>
  </g>

  <!-- ================= hop map (right) ================= -->
  <text class="mono dim" x="660" y="64" font-size="13">LIVE ROUTE · 5 HOPS</text>
  <circle cx="1120" cy="300" r="90" fill="url(#glow)"/>

  <path id="route" d="M692 330 L792 220 L896 320 L1002 200 L1108 300" fill="none" stroke="#30363d" stroke-width="1.5"/>
  <path d="M692 330 L792 220 L896 320 L1002 200 L1108 300" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.35">
    <animate attributeName="stroke-dashoffset" from="140" to="0" dur="7s" repeatCount="indefinite"/>
  </path>

  <!-- probe packet: pauses at every hop, in step with the terminal -->
  <circle r="6" fill="#58a6ff">
    <animateMotion dur="14s" repeatCount="indefinite" keyPoints="0;0;0.25;0.25;0.5;0.5;0.75;0.75;1;1" keyTimes="0;0.086;0.2;0.24;0.314;0.36;0.429;0.47;0.543;1" calcMode="linear" path="M692 330 L792 220 L896 320 L1002 200 L1108 300"/>
  </circle>
  <!-- ack packet going home after the route is up -->
  <circle r="4" fill="#3fb950" opacity="0">
    <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.66;0.95;1" values="0;1;0;0"/>
    <animateMotion dur="14s" repeatCount="indefinite" keyPoints="1;1;0;0" keyTimes="0;0.66;0.95;1" calcMode="linear" path="M692 330 L792 220 L896 320 L1002 200 L1108 300"/>
  </circle>

  <!-- hops: node + arrival ripple -->
  <g>
    <circle cx="692" cy="330" r="22" fill="none" stroke="#58a6ff" opacity="0">
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.086;0.15;1" values="0;0.8;0;0"/>
      <animate attributeName="r" dur="14s" repeatCount="indefinite" keyTimes="0;0.086;0.15;1" values="12;12;30;30"/>
    </circle>
    <circle cx="692" cy="330" r="11" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <circle cx="692" cy="330" r="4" fill="#58a6ff"/>
    <text class="mono dim" x="692" y="368" font-size="12" text-anchor="middle">home.lan</text>
  </g>
  <g>
    <circle cx="792" cy="220" r="22" fill="none" stroke="#58a6ff" opacity="0">
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.2;0.27;1" values="0;0.8;0;0"/>
      <animate attributeName="r" dur="14s" repeatCount="indefinite" keyTimes="0;0.2;0.27;1" values="12;12;30;30"/>
    </circle>
    <circle cx="792" cy="220" r="11" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <circle cx="792" cy="220" r="4" fill="#58a6ff"/>
    <text class="mono dim" x="792" y="196" font-size="12" text-anchor="middle">isp-edge</text>
  </g>
  <g>
    <circle cx="896" cy="320" r="22" fill="none" stroke="#d29922" opacity="0">
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.314;0.38;1" values="0;0.8;0;0"/>
      <animate attributeName="r" dur="14s" repeatCount="indefinite" keyTimes="0;0.314;0.38;1" values="12;12;30;30"/>
    </circle>
    <circle cx="896" cy="320" r="11" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <circle cx="896" cy="320" r="4" fill="#d29922"/>
    <text class="mono dim" x="896" y="358" font-size="12" text-anchor="middle">ix-peering</text>
  </g>
  <g>
    <circle cx="1002" cy="200" r="22" fill="none" stroke="#d29922" opacity="0">
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.429;0.5;1" values="0;0.8;0;0"/>
      <animate attributeName="r" dur="14s" repeatCount="indefinite" keyTimes="0;0.429;0.5;1" values="12;12;30;30"/>
    </circle>
    <circle cx="1002" cy="200" r="11" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <circle cx="1002" cy="200" r="4" fill="#d29922"/>
    <text class="mono dim" x="1002" y="176" font-size="12" text-anchor="middle">bgp-core</text>
  </g>
  <g>
    <circle cx="1108" cy="300" r="26" fill="none" stroke="#7ee787" opacity="0">
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" keyTimes="0;0.543;0.63;1" values="0;0.9;0;0"/>
      <animate attributeName="r" dur="14s" repeatCount="indefinite" keyTimes="0;0.543;0.63;1" values="16;16;42;42"/>
    </circle>
    <circle cx="1108" cy="300" r="16" fill="#161b22" stroke="#7ee787" stroke-width="2"/>
    <text class="mono" x="1108" y="305" font-size="11" fill="#7ee787" text-anchor="middle">core</text>
    <text class="mono dim" x="1108" y="344" font-size="12" text-anchor="middle">core.dakidakq</text>
  </g>

  <!-- uptime strip -->
  <g class="mono" font-size="12">
    <text x="660" y="416" fill="#8b949e">status <tspan fill="#3fb950">● up</tspan>   packets <tspan fill="#58a6ff">∞</tspan>   loss <tspan fill="#7ee787">0%</tspan>   coffee <tspan fill="#d29922">99%</tspan></text>
  </g>
</svg>
