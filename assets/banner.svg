<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Dakidakq — network engineer">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#21262d"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1117" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#0d1117" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Consolas, "Liberation Mono", monospace; }
      .link { stroke: #30363d; stroke-width: 1.5; fill: none; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .pulse { transform-origin: 930px 160px; animation: pulse 2.6s ease-out infinite; }
      @keyframes pulse { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(2.4); opacity: 0; } }
      .label { font-size: 13px; fill: #8b949e; }
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="#0d1117"/>
  <rect width="1200" height="320" rx="18" fill="url(#dots)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="17.5" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- topology links -->
  <path id="l1" class="link" d="M930 160 L770 85"/>
  <path id="l2" class="link" d="M930 160 L770 240"/>
  <path id="l3" class="link" d="M930 160 L1090 85"/>
  <path id="l4" class="link" d="M930 160 L1090 240"/>
  <path id="l5" class="link" d="M770 85 L770 240"/>
  <path id="l6" class="link" d="M1090 85 L1090 240"/>
  <path id="l7" class="link" d="M770 85 L1090 85" stroke-dasharray="4 6"/>

  <!-- packets -->
  <circle r="4" fill="#58a6ff"><animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#l1"/></animateMotion></circle>
  <circle r="4" fill="#7ee787"><animateMotion dur="3.1s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#l2"/></animateMotion></circle>
  <circle r="4" fill="#58a6ff"><animateMotion dur="2.8s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#l3"/></animateMotion></circle>
  <circle r="4" fill="#d2a8ff"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#l4"/></animateMotion></circle>
  <circle r="3" fill="#7ee787"><animateMotion dur="3.6s" repeatCount="indefinite"><mpath href="#l5"/></animateMotion></circle>
  <circle r="3" fill="#d2a8ff"><animateMotion dur="4s" repeatCount="indefinite" keyPoints="1;0" keyTimes="0;1" calcMode="linear"><mpath href="#l6"/></animateMotion></circle>
  <circle r="3" fill="#58a6ff"><animateMotion dur="5s" repeatCount="indefinite"><mpath href="#l7"/></animateMotion></circle>

  <!-- edge nodes -->
  <g>
    <circle cx="770" cy="85" r="18" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <circle cx="770" cy="85" r="5" fill="#58a6ff"/>
    <text class="mono label" x="770" y="125" text-anchor="middle">python</text>
  </g>
  <g>
    <circle cx="770" cy="240" r="18" fill="#161b22" stroke="#7ee787" stroke-width="1.5"/>
    <circle cx="770" cy="240" r="5" fill="#7ee787"/>
    <text class="mono label" x="770" y="280" text-anchor="middle">c++</text>
  </g>
  <g>
    <circle cx="1090" cy="85" r="18" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <circle cx="1090" cy="85" r="5" fill="#58a6ff"/>
    <text class="mono label" x="1090" y="125" text-anchor="middle">typescript</text>
  </g>
  <g>
    <circle cx="1090" cy="240" r="18" fill="#161b22" stroke="#d2a8ff" stroke-width="1.5"/>
    <circle cx="1090" cy="240" r="5" fill="#d2a8ff"/>
    <text class="mono label" x="1090" y="280" text-anchor="middle">node.js</text>
  </g>

  <!-- core node -->
  <circle class="pulse" cx="930" cy="160" r="28" fill="none" stroke="#7ee787" stroke-width="1.5"/>
  <circle cx="930" cy="160" r="28" fill="#161b22" stroke="#7ee787" stroke-width="2"/>
  <text class="mono" x="930" y="165" text-anchor="middle" font-size="13" fill="#7ee787">core</text>

  <!-- text side (fade keeps it readable over the grid) -->
  <rect x="0" y="0" width="700" height="320" rx="18" fill="url(#fade)"/>
  <text class="mono" x="70" y="108" font-size="20" fill="#7ee787">~/dakidakq $ <tspan fill="#e6edf3">whoami</tspan></text>
  <rect class="cursor" x="300" y="92" width="11" height="20" fill="#e6edf3"/>
  <text class="mono" x="66" y="182" font-size="68" font-weight="700" fill="#e6edf3">Dakidakq</text>
  <text class="mono" x="70" y="226" font-size="22" fill="#58a6ff">network engineer</text>
  <text class="mono" x="70" y="258" font-size="17" fill="#8b949e">python · c++ · typescript · node.js</text>
</svg>
