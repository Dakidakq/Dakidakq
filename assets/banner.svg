<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Dakidakq — claude session terminal">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#21262d"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Consolas, "Liberation Mono", monospace; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="#0d1117"/>
  <rect width="1200" height="320" rx="18" fill="url(#dots)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="17.5" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- terminal -->
  <rect x="300" y="34" width="600" height="252" rx="12" fill="#161b22" stroke="#30363d"/>
  <rect x="300" y="34" width="600" height="34" rx="12" fill="#21262d"/>
  <rect x="300" y="56" width="600" height="12" fill="#21262d"/>
  <circle cx="324" cy="51" r="5.5" fill="#f85149"/>
  <circle cx="344" cy="51" r="5.5" fill="#d29922"/>
  <circle cx="364" cy="51" r="5.5" fill="#3fb950"/>
  <text class="mono" x="600" y="56" font-size="12" fill="#8b949e" text-anchor="middle">dakidakq@core-01 — claude</text>

  <g class="mono" font-size="13.5" xml:space="preserve">
    <text x="324" y="96" fill="#7ee787">$ <tspan fill="#e6edf3">claude</tspan></text>

    <text x="324" y="124" fill="#d2a8ff" opacity="0">✻ Claude Code — session started
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.09;1" values="0;1;1"/>
    </text>
    <text x="324" y="160" fill="#8b949e" opacity="0">&gt; <tspan fill="#e6edf3">работаем</tspan>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.25;1" values="0;1;1"/>
    </text>
    <text x="324" y="196" fill="#7ee787" opacity="0">● <tspan fill="#e6edf3">ты уже холодный,</tspan>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.45;1" values="0;1;1"/>
    </text>
    <text x="324" y="224" fill="#e6edf3" opacity="0">  как 3 дня замороженный 🥶
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.52;1" values="0;1;1"/>
    </text>

    <text x="324" y="266" fill="#8b949e" opacity="0">&gt; <tspan class="cursor" fill="#e6edf3">▍</tspan>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.6;1" values="0;1;1"/>
    </text>
  </g>
</svg>
