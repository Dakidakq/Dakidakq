<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Dakidakq — network engineer">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#21262d"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1117" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#0d1117" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Consolas, "Liberation Mono", monospace; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="#0d1117"/>
  <rect width="1200" height="320" rx="18" fill="url(#dots)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="17.5" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- ===== right: traceroute terminal ===== -->
  <rect x="712" y="34" width="452" height="252" rx="12" fill="#161b22" stroke="#30363d"/>
  <rect x="712" y="34" width="452" height="34" rx="12" fill="#21262d"/>
  <rect x="712" y="56" width="452" height="12" fill="#21262d"/>
  <circle cx="736" cy="51" r="5.5" fill="#f85149"/>
  <circle cx="756" cy="51" r="5.5" fill="#d29922"/>
  <circle cx="776" cy="51" r="5.5" fill="#3fb950"/>
  <text class="mono" x="938" y="56" font-size="12" fill="#8b949e" text-anchor="middle">dakidakq@core-01 — ssh</text>

  <g class="mono" font-size="13.5" xml:space="preserve">
    <text x="736" y="96" fill="#7ee787">$ <tspan fill="#e6edf3">traceroute core.dakidakq.net</tspan></text>

    <text x="736" y="124" fill="#e6edf3" opacity="0"> 1  home.lan        <tspan fill="#7ee787">0.4 ms</tspan>
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.086;1" values="0;1;1"/>
    </text>
    <text x="736" y="152" fill="#e6edf3" opacity="0"> 2  isp-edge        <tspan fill="#7ee787">3.1 ms</tspan>
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.2;1" values="0;1;1"/>
    </text>
    <text x="736" y="180" fill="#e6edf3" opacity="0"> 3  ix-peering      <tspan fill="#d29922">8.7 ms</tspan>
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.314;1" values="0;1;1"/>
    </text>
    <text x="736" y="208" fill="#e6edf3" opacity="0"> 4  bgp-core        <tspan fill="#d29922">12.9 ms</tspan>
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.429;1" values="0;1;1"/>
    </text>
    <text x="736" y="236" fill="#e6edf3" opacity="0"> 5  core.dakidakq   <tspan fill="#58a6ff">14.2 ms</tspan>
      <animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.543;1" values="0;1;1"/>
    </text>

    <text x="736" y="266" fill="#7ee787">$ <tspan class="cursor" fill="#e6edf3">▍</tspan><tspan fill="#3fb950" opacity="0"> ✓ 0% loss<animate attributeName="opacity" dur="14s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.66;0.98;1" values="0;1;1;0"/></tspan></text>
  </g>

  <!-- ===== left: text ===== -->
  <rect x="0" y="0" width="720" height="320" rx="18" fill="url(#fade)"/>
  <text class="mono" x="70" y="108" font-size="20" fill="#7ee787">~/dakidakq $ <tspan fill="#e6edf3">whoami</tspan></text>
  <rect class="cursor" x="300" y="92" width="11" height="20" fill="#e6edf3"/>
  <text class="mono" x="66" y="182" font-size="68" font-weight="700" fill="#e6edf3">Dakidakq</text>
  <text class="mono" x="70" y="226" font-size="22" fill="#58a6ff">network engineer</text>
  <text class="mono" x="70" y="258" font-size="17" fill="#8b949e">python · c++ · typescript · node.js</text>
</svg>
