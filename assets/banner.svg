<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Dakidakq — network engineer">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#21262d"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1117" stop-opacity="1"/>
      <stop offset="0.45" stop-color="#0d1117" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, "JetBrains Mono", Consolas, "Liberation Mono", monospace; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="#0d1117"/>
  <rect width="1200" height="320" rx="18" fill="url(#dots)"/>
  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="17.5" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <!-- ===== right: traceroute terminal ===== -->
  <rect x="712" y="34" width="452" height="252" rx="12" fill="#161b22" stroke="#30363d"/>
  <rect x="712" y="34" width="452" height="34" rx="12" fill="#21262d"/>
  <rect x="712" y="56" width="452" height="12" fill="#21262d"/>
  <circle cx="736" cy="51" r="5.5" fill="#f85149"/>
  <circle cx="756" cy="51" r="5.5" fill="#d29922"/>
  <circle cx="776" cy="51" r="5.5" fill="#3fb950"/>
  <text class="mono" x="938" y="56" font-size="12" fill="#8b949e" text-anchor="middle">dakidakq@core-01 — claude</text>

  <g class="mono" font-size="13.5" xml:space="preserve">
    <text x="736" y="96" fill="#7ee787">$ <tspan fill="#e6edf3">claude</tspan></text>

    <text x="736" y="124" fill="#d2a8ff" opacity="0">✻ Claude Code — session started
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.09;1" values="0;1;1"/>
    </text>
    <text x="736" y="160" fill="#8b949e" opacity="0">&gt; <tspan fill="#e6edf3">работаем</tspan>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.25;1" values="0;1;1"/>
    </text>
    <text x="736" y="196" fill="#7ee787" opacity="0">● <tspan fill="#e6edf3">ты уже холодный,</tspan>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.45;1" values="0;1;1"/>
    </text>
    <text x="736" y="224" fill="#e6edf3" opacity="0">  как 3 дня замороженный 🥶
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.52;1" values="0;1;1"/>
    </text>

    <text x="736" y="266" fill="#8b949e" opacity="0">&gt; <tspan class="cursor" fill="#e6edf3">▍</tspan>
      <animate attributeName="opacity" dur="12s" repeatCount="indefinite" calcMode="discrete" keyTimes="0;0.6;1" values="0;1;1"/>
    </text>
  </g>

  <!-- ===== left: text ===== -->
  <rect x="0" y="0" width="720" height="320" rx="18" fill="url(#fade)"/>
  <text class="mono" x="70" y="108" font-size="20" fill="#7ee787">~/dakidakq $ <tspan fill="#e6edf3">whoami</tspan></text>
  <rect class="cursor" x="300" y="92" width="11" height="20" fill="#e6edf3"/>
  <text class="mono" x="66" y="182" font-size="68" font-weight="700" fill="#e6edf3">Dakidakq</text>
  <text class="mono" x="70" y="226" font-size="22" fill="#58a6ff">network engineer</text>
  <text class="mono" x="70" y="258" font-size="17" fill="#8b949e">python · c++ · typescript · node.js</text>
</svg>
